# PLND API Production Configuration
# This file overrides default values for production environment

[api]
# Shorter timeout for production
timeout = 10000

[logging]
# Less verbose logging for production
level = "info"
pretty_print = false

[external_providers]
# Open Food Facts: production server requires no basic auth.
off_base_url = "https://world.openfoodfacts.org"
off_basic_auth_user = ""
off_basic_auth_password = ""