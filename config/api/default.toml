# PLND API Default Configuration
# This file contains the default configuration values

[api]
# Server binding address and port
base_url = "0.0.0.0:3000"
# Request timeout in milliseconds
timeout = 30000

[database]
# PostgreSQL connection URL
url = "postgres://plnd:plnd_dev@localhost/plnd_dev"
# Maximum database connections in the pool
max_connections = 10

[logging]
# Log level: debug, info, warn, error
level = "info"
# Pretty print logs for development
pretty_print = true

[auth]
# JWT configuration
jwt_secret = ""  # Required — set via APP_AUTH__JWT_SECRET (Doppler)
jwt_expiration = 86400 # 24 hours in seconds
refresh_token_expiration = 604800 # 7 days in seconds
# Allowed CORS origin for the Angular frontend
frontend_origin = "http://localhost:4200"

[auth.oidc]
# Browser-facing OIDC issuer URL (used for iss claim validation in tokens)
issuer_url = "http://localhost:8080/plnd-dev"
# Internal issuer URL for server-to-server JWKS fetching (Docker-internal hostname).
# Leave empty to fall back to issuer_url (for local dev without Docker).
internal_issuer_url = ""
# OIDC client ID registered with the IdP
client_id = "mock-client"

[external_providers]
# Free key: https://fdc.nal.usda.gov/api-guide.html
usda_fdc_api_key = ""
themealdb_api_key = "1"
# Open Food Facts: use staging server with public basic-auth during development.
# Switch to https://world.openfoodfacts.org with no credentials before production launch.
off_base_url = "https://world.openfoodfacts.net"
off_basic_auth_user = "off"
off_basic_auth_password = "off"

# Morning briefing — news
# RSS/Atom feed URLs to aggregate. Headlines are merged and sorted newest-first.
# Leave empty to disable the headlines card.
news_feed_urls = [
  "https://xkcd.com/rss.xml",
  "https://news.ycombinator.com/rss",
  "https://en.wikipedia.org/w/api.php?action=featuredfeed&feed=featured&feedformat=atom",
]

[llm.fast]
# Low-latency model for quick, structured tasks (intent parsing, suggestions).
provider = "anthropic"
base_url = "https://api.anthropic.com"
model = "claude-haiku-4-5-20251001"
api_key = ""  # Set via APP_LLM__FAST__API_KEY (Doppler: plnd/dev)
max_tokens = 1024
max_iterations = 10

[llm.capable]
# High-capability model for complex reasoning (meal planning, full-day analysis).
provider = "anthropic"
base_url = "https://api.anthropic.com"
model = "claude-opus-4-6"
api_key = ""  # Set via APP_LLM__CAPABLE__API_KEY (Doppler: plnd/dev)
max_tokens = 4096
max_iterations = 10
