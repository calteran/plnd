# PLND API Default Configuration
# This file contains the default configuration values

[api]
# Server binding address and port
base_url = "0.0.0.0:3000"
# Request timeout in milliseconds
timeout = 30000

[database]
# PostgreSQL connection URL
url = "postgres://plnd:plnd_dev@localhost/plnd_dev"
# Maximum database connections in the pool
max_connections = 10

[logging]
# Log level: debug, info, warn, error
level = "info"
# Pretty print logs for development
pretty_print = true

[auth]
# JWT configuration
jwt_secret = "development-secret-change-in-production"
jwt_expiration = 86400 # 24 hours in seconds
refresh_token_expiration = 604800 # 7 days in seconds

# OAuth providers configuration
[[auth.oauth_providers]]
name = "mock"
client_id = "mock-client"
client_secret = "mock-secret"
redirect_uri = "http://localhost:4200/auth/mock/callback"
issuer_url = "http://localhost:8080"
scopes = ["openid", "email", "profile"]
enabled = true

[[auth.oauth_providers]]
name = "google"
client_id = ""
client_secret = ""
redirect_uri = "http://localhost:4200/auth/google/callback"
scopes = ["openid", "email", "profile"]
enabled = false

[[auth.oauth_providers]]
name = "apple"
client_id = ""
client_secret = ""
redirect_uri = "http://localhost:4200/auth/apple/callback"
scopes = ["name", "email"]
enabled = false