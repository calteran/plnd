# PLND API Development Configuration
# This file overrides default values for development environment

[api]
# Longer timeout for development
timeout = 60000

[logging]
# More verbose logging for development
level = "debug,h2=warn,hyper_util=warn,tonic=warn,tower=warn,opentelemetry_sdk=warn"
pretty_print = true

[llm.fast]
# Anthropic Claude Haiku — low-latency tasks; key set via Doppler APP_LLM__FAST__API_KEY.
max_tokens = 4096

[llm.capable]
# Anthropic Claude Sonnet — complex reasoning in dev; Opus used in production via default.toml.
# Key set via Doppler APP_LLM__CAPABLE__API_KEY.
model = "claude-sonnet-4-6"
max_tokens = 16384

[otel]
endpoint = "http://localhost:4317"