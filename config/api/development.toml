# PLND API Development Configuration
# This file overrides default values for development environment

[api]
# Longer timeout for development
timeout = 60000

[logging]
# More verbose logging for development
level = "debug"
pretty_print = true

[llm.fast]
# LM Studio (native, Apple Silicon / MLX) — Gemma 4 26B MoE for low-latency tasks.
# MoE activates only ~4B params per forward pass; fast despite large total size.
# Override model via APP_LLM__FAST__MODEL env var.
provider = "openai"
base_url = "http://localhost:1234/v1"
model = "google/gemma-4-26b-a4b"
api_key = "lm-studio"
max_tokens = 1024
max_iterations = 10

[llm.capable]
# LM Studio (native, Apple Silicon / MLX) — Gemma 4 26B MoE for complex reasoning.
# Override model via APP_LLM__CAPABLE__MODEL env var.
provider = "openai"
base_url = "http://localhost:1234/v1"
model = "google/gemma-4-26b-a4b"
api_key = "lm-studio"
max_tokens = 4096
max_iterations = 10

[otel]
endpoint = "http://localhost:4317"