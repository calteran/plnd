# PLND API Development Configuration
# This file overrides default values for development environment

[api]
# Longer timeout for development
timeout = 60000

[logging]
# More verbose logging for development
level = "debug"
pretty_print = true

[llm.fast]
# Local Ollama instance (Docker) — qwen2.5:3b for low-latency tasks.
# Override model via APP_LLM__FAST__MODEL env var.
provider = "openai"
base_url = "http://localhost:11434/v1"
model = "qwen2.5:3b"
api_key = "ollama"
max_tokens = 1024
max_iterations = 10

[llm.capable]
# Local Ollama instance (Docker) — qwen2.5:14b for complex reasoning.
# Override model via APP_LLM__CAPABLE__MODEL env var.
provider = "openai"
base_url = "http://localhost:11434/v1"
model = "qwen2.5:14b"
api_key = "ollama"
max_tokens = 4096
max_iterations = 10