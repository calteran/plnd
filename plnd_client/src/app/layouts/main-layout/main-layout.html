<!-- main-layout.html -->
<div class="main-layout">

  @if (standoff(); as s) {
    <app-timezone-standoff
      [intendedZone]="s.intended_zone"
      [deviceZone]="s.device_zone"
      (moved)="onMoved(s)"
      (clockOff)="onClockOff()"
    />
  }

  <header class="top-bar">
    <span class="app-title">PLND</span>
    <app-navbar-avatar />
  </header>

  <div class="main-body">
    <aside class="sidebar"
           [class.expanded]="sidebarExpanded()"
           (mouseenter)="expandSidebar()"
           (mouseleave)="collapseSidebar()"
           (focusin)="expandSidebar()"
           (focusout)="collapseSidebar()">
      <nav class="sidebar-nav" aria-label="Sidebar navigation">
        <a [routerLink]="['/day', todayDate]" routerLinkActive="active"
           class="sidebar-item" aria-label="Today">
          <span class="sidebar-icon" aria-hidden="true">📅</span>
          <span class="sidebar-label">Today</span>
        </a>
        <a routerLink="/plan/week" routerLinkActive="active"
           class="sidebar-item" aria-label="Plan Week">
          <span class="sidebar-icon" aria-hidden="true">📋</span>
          <span class="sidebar-label">Plan Week</span>
          @if (weekPlanService.hasUnplannedHorizon()) {
            <span class="sidebar-badge" aria-label="Week not yet planned"></span>
          }
        </a>
      </nav>
    </aside>

    <main class="content-area">
      <router-outlet />
    </main>
  </div>

  <!-- Mobile bottom tabs -->
  <nav class="bottom-tabs" aria-label="Tab bar">
    <a [routerLink]="['/day', todayDate]" routerLinkActive="active"
       class="bottom-tab" aria-label="Today">
      <span class="tab-icon" aria-hidden="true">📅</span>
      <span class="tab-label">Today</span>
    </a>
    <a routerLink="/plan/week" routerLinkActive="active"
       class="bottom-tab" aria-label="Plan Week">
      <span class="tab-icon" aria-hidden="true">📋</span>
      <span class="tab-label">Plan</span>
    </a>
  </nav>

</div>
