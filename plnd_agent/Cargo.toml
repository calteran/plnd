[package]
name = "plnd_agent"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT"

[features]
test-utils = []

[dependencies]
plnd_data    = { path = "../plnd_data" }
rust_decimal = { version = "1" }
async-trait  = "0.1"
chrono       = { version = "0.4", features = ["serde"] }
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"
tokio        = { version = "1", features = ["full"] }
thiserror    = "2.0"
fastrand     = "2"
uuid         = { version = "1", features = ["v4", "serde"] }
reqwest      = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
jsonschema   = { version = "0.46", default-features = false } # disables resolve-http/resolve-file; format validators (uuid, date-time) are unconditional
tracing      = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
toml  = "1.1"
