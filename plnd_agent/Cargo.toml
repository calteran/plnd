[package]
name = "plnd_agent"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
test-utils = []

[dependencies]
plnd_data    = { path = "../plnd_data" }
async-trait  = "0.1"
chrono       = { version = "0.4", features = ["serde"] }
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"
tokio        = { version = "1", features = ["full"] }
thiserror    = "2.0"
uuid         = { version = "1", features = ["v4", "serde"] }
reqwest      = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
async-openai = "0.28"
jsonschema   = { version = "0.29", default-features = false } # disables HTTP $ref resolution; not needed for static schemas
tracing      = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
toml  = "0.8"
