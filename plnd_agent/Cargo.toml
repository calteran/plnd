[package]
name = "plnd_agent"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
test-utils = []

[dependencies]
plnd_data    = { path = "../plnd_data" }
rust_decimal = { version = "1" }
sqlx         = { version = "0.8", features = ["postgres", "runtime-tokio"] }
async-trait  = "0.1"
chrono       = { version = "0.4", features = ["serde"] }
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"
tokio        = { version = "1", features = ["full"] }
thiserror    = "2.0"
uuid         = { version = "1", features = ["v4", "serde"] }
reqwest      = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
async-openai = { version = "0.34", features = ["chat-completion"] }
jsonschema   = { version = "0.45", default-features = false } # disables resolve-http/resolve-file; format validators (uuid, date-time) are unconditional
tracing      = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
toml  = "1.1"
sqlx  = { version = "0.8", features = ["postgres", "uuid", "chrono", "runtime-tokio", "migrate", "macros"] }
