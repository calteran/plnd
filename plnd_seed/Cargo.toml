[package]
name = "plnd_seed"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT"

[lib]
name = "plnd_seed"
path = "src/lib.rs"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"

[[bin]]
name = "build_usda_corpus"
path = "src/bin/build_usda_corpus.rs"

[dependencies]
plnd_data = { path = "../plnd_data" }
sqlx = { version = "0.9", features = ["postgres", "uuid", "runtime-tokio", "json", "rust_decimal", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
serde_json = "1.0"
rust_decimal = { version = "1", features = ["db-postgres"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2.0"
anyhow = "1.0"
flate2 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
sqlx = { version = "0.9", features = ["macros"] }
tempfile = "3"

[package.metadata.cargo-machete]
ignored = ["rust_decimal"]  # used via sqlx rust_decimal feature for Decimal Encode/Type impls
