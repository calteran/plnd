version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /plnd_client
    schedule:
      interval: weekly
    groups:
      angular:
        patterns:
          - '@angular/*'
      ngrx:
        patterns:
          - '@ngrx/*'
      angular-eslint:
        patterns:
          - '@angular-eslint/*'
          - '@typescript-eslint/*'
          - 'eslint'
      npm:
        patterns:
          - '*'
        exclude-patterns:
          - '@angular/*'
          - '@ngrx/*'
          - '@angular-eslint/*'
          - '@typescript-eslint/*'
          - 'eslint'

  - package-ecosystem: docker
    directory: /plnd_api
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /plnd_client
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
