name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `CI=true` signals to scripts and test runners (e.g. plnd_client/e2e/global-setup.ts)
# that they should skip local infra management since the workflow has its own
# setup steps. GitHub Actions sets `CI=true` by default; declaring it here makes
# the dependency explicit and survives alternative runners (act, self-hosted
# without the standard env).
env:
  CI: true

jobs:
  # ── Job 1: Rust lint + build + unit tests ───────────────────────────────────
  backend:
    name: Backend
    runs-on: self-hosted
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: plnd
          POSTGRES_PASSWORD: plnd_dev
          POSTGRES_DB: plnd_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plnd -d plnd_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-machete
        uses: taiki-e/install-action@cargo-machete

      - name: Rust – check formatting
        run: cargo fmt --check

      - name: Rust – Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rust – cargo-deny (licenses + advisories)
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Rust – cargo-machete (unused deps)
        run: cargo machete

      - name: Tracing – no unsafe skip() in route handlers (issue #803)
        run: |
          if grep -rEn 'tracing::instrument\([^)]*skip\(' plnd_api/src/routes/ ; then
            echo "::error::Found tracing::instrument(skip(...)) in plnd_api/src/routes/. Use skip_all with explicit fields(...) to avoid leaking PII-bearing args like Extension<Claims> into tracing spans. See issue #803."
            exit 1
          fi

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Build (verify compilation)
        run: cargo build --workspace

      - name: Run tests
        run: cargo nextest run --workspace
        env:
          DATABASE_URL: postgres://plnd:plnd_dev@localhost/plnd_dev

      - name: Cache API binary for e2e job
        uses: actions/cache/save@v6
        with:
          path: target/debug/plnd_api
          key: plnd-api-binary-${{ github.run_id }}

  # ── Job 2: Angular lint + unit tests ───────────────────────────────────────
  client:
    name: Client
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: plnd_client/package-lock.json

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: plnd_client/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('plnd_client/package-lock.json') }}

      - name: Install Angular dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: cd plnd_client && npm ci

      - name: Angular – ESLint
        run: cd plnd_client && npx eslint "src/**/*.ts"

      - name: Angular – dependency health
        run: cd plnd_client && npm run check-dependencies && npm run check-licenses && npm run check-circular

      - name: Run Angular unit tests (Vitest + jsdom)
        run: cd plnd_client && npx ng test --no-watch --coverage

  # ── Job 3: End-to-end tests ─────────────────────────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: self-hosted
    needs: [backend, client]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: plnd
          POSTGRES_PASSWORD: plnd_dev
          POSTGRES_DB: plnd_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plnd -d plnd_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Start mock OAuth server (background)
        run: |
          docker run -d \
            --name mock-oauth-server \
            -p 8080:8080 \
            -e JSON_CONFIG_PATH=/config/config.json \
            -v ${{ github.workspace }}/config/mock-oauth:/config \
            ghcr.io/navikt/mock-oauth2-server:3.0.3

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: plnd_client/package-lock.json

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: plnd_client/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('plnd_client/package-lock.json') }}

      - name: Install Angular dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: cd plnd_client && npm ci

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('plnd_client/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: cd plnd_client && npx playwright install chromium --with-deps

      - name: Restore API binary from cache
        uses: actions/cache/restore@v6
        with:
          path: target/debug/plnd_api
          key: plnd-api-binary-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Make API binary executable
        run: chmod +x target/debug/plnd_api

      - name: Wait for mock OAuth server
        run: |
          timeout 30s bash -c 'until curl -sf http://localhost:8080/plnd-dev/.well-known/openid-configuration; do sleep 1; done'

      - name: Start API server (background)
        run: |
          cd plnd_api
          APP_DATABASE__URL=postgres://plnd:plnd_dev@localhost/plnd_dev \
          APP_AUTH__OIDC_INTERNAL_ISSUER_URL=http://localhost:8080/plnd-dev \
          APP_AUTH__FRONTEND_ORIGIN=http://localhost:4200 \
          APP_EXTERNAL__FIXTURE_PATH=${{ github.workspace }}/plnd_data/fixtures \
          ../target/debug/plnd_api &
          timeout 30s bash -c 'until curl -sf http://localhost:3000/health; do sleep 1; done'

      - name: Run Playwright e2e tests
        run: cd plnd_client && npm run e2e:ci

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: plnd_client/playwright-report/
          retention-days: 7
