[package]
name = "plnd_api"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1.0", features = ["full"] }
sqlx = { version = "0.8", features = ["postgres", "uuid", "chrono", "runtime-tokio", "migrate", "json", "rust_decimal"] }
rust_decimal = { version = "1", features = ["db-postgres"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
config = "0.13"
dotenv = "0.15"
oauth2 = "4.4"
jsonwebtoken = "9.3"
reqwest = { version = "0.11", features = ["json"] }
url = "2.5"
uuid = { version = "1.8", features = ["v4", "serde"] }
async-trait = "0.1"
serde_json = "1.0"
moka         = { version = "0.12", features = ["future"] }
tokio-stream = { version = "0.1",  features = ["sync"]   }
futures      = "0.3"
utoipa = { version = "5.4", features = ["uuid", "chrono", "decimal"] }
utoipa-swagger-ui = { version = "9.0", features = ["axum"] }
utoipa-scalar = { version = "0.3", features = ["axum"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }

[package.metadata.cargo-machete]
ignored = ["futures", "oauth2", "url", "utoipa"]

[package.metadata.nextest]
# Configure nextest for better test execution
profile = "default"
# Run tests in parallel with 4 threads
threads = 4
# Show progress bar
status-level = "pass"
# Fail fast on first failure
fail-fast = false
# Retry flaky tests
retries = 2