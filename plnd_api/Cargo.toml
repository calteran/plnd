[package]
name = "plnd_api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio"] }
# Using latest stable version compatible with Rust 2024 edition
base64ct = "1.6"
