services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: plnd
      POSTGRES_PASSWORD: plnd_dev
      POSTGRES_DB: plnd_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "3000:3000"
    environment:
      - APP_API__BASE_URL=0.0.0.0:3000
      - APP_DATABASE__URL=postgres://plnd:plnd_dev@db/plnd_dev
      - APP_API__TIMEOUT=30000
      - APP_DATABASE__MAX_CONNECTIONS=10
      - APP_LOGGING__LEVEL=debug
      - APP_LOGGING__PRETTY_PRINT=true
    depends_on:
      - db

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - "4200:4200"
    environment:
      - NODE_ENV=development
    depends_on:
      - api

volumes:
  postgres_data:
  node_modules: