services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: plnd
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: plnd_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plnd -d plnd_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: plnd_api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - APP_API__BASE_URL=0.0.0.0:3000
      - APP_DATABASE__URL=postgres://plnd:${DB_PASSWORD}@db/plnd_dev
      - APP_API__TIMEOUT=30000
      - APP_DATABASE__MAX_CONNECTIONS=10
      - APP_LOGGING__LEVEL=debug
      - APP_LOGGING__PRETTY_PRINT=true
      # Server-to-server: API → mock OAuth server inside Docker network
      - APP_AUTH__OIDC_INTERNAL_ISSUER_URL=http://mock-oauth-server:8080/plnd-dev
      # Allowed CORS origin for the Angular frontend
      - APP_AUTH__FRONTEND_ORIGIN=http://localhost:4200
      # Local LLM via Ollama (OpenAI-compatible)
      - APP_LLM__FAST__PROVIDER=openai_compat
      - APP_LLM__FAST__BASE_URL=http://ollama:11434/v1
      - APP_LLM__FAST__MODEL=${OLLAMA_FAST_MODEL:-phi3}
      - APP_LLM__FAST__API_KEY=
      - APP_LLM__CAPABLE__PROVIDER=openai_compat
      - APP_LLM__CAPABLE__BASE_URL=http://ollama:11434/v1
      - APP_LLM__CAPABLE__MODEL=${OLLAMA_CAPABLE_MODEL:-llama3.2}
      - APP_LLM__CAPABLE__API_KEY=
    depends_on:
      db:
        condition: service_healthy
      mock-oauth-server:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  mock-oauth-server:
    image: ghcr.io/navikt/mock-oauth2-server:3.0.1
    ports:
      - "8080:8080"
    environment:
      - ISSUER_ID=plnd-dev
      - INTERACTIVE_LOGIN=true
      - JSON_CONFIG=true
    volumes:
      - ./config/mock-oauth:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://localhost:8080/default/.well-known/openid-configuration"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  client:
    build:
      context: .
      dockerfile: plnd_client/Dockerfile
    ports:
      - "4200:4200"
    environment:
      - NODE_ENV=development
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://127.0.0.1:4200"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./scripts/ollama-entrypoint.sh:/entrypoint.sh:ro
    environment:
      - OLLAMA_FAST_MODEL=${OLLAMA_FAST_MODEL:-phi3}
      - OLLAMA_CAPABLE_MODEL=${OLLAMA_CAPABLE_MODEL:-llama3.2}
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    healthcheck:
      # `ollama list` queries the server API and is guaranteed to be in the image.
      # It succeeds as soon as ollama serve starts — before model pulls complete.
      # The api service depends_on this healthcheck, so the first inference
      # request may be slow while a model pull is still in progress.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  postgres_data:
  node_modules:
  ollama_data:
