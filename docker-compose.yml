# Pin the Compose project name so EVERY worktree's `docker compose` targets the
# same shared infra (db, mock-oauth, observability). Without this, each worktree
# derives a distinct project name from its directory and would spin up its own
# Postgres that re-collides on host port 5432 — defeating shared infra.
name: plnd

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: plnd
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: plnd_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plnd -d plnd_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  mock-oauth-server:
    image: ghcr.io/navikt/mock-oauth2-server:3.0.3
    ports:
      - "8080:8080"
    environment:
      - JSON_CONFIG_PATH=/config/config.json
    volumes:
      - ./config/mock-oauth:/config
    # Gate on the JWKS endpoint of the *configured* `plnd-dev` issuer, NOT the
    # built-in `/default` issuer. The auth flow only ever uses `plnd-dev`: e2e
    # mints tokens at /plnd-dev/token and plnd_api validates them against
    # /plnd-dev/jwks (issuer comes from config/mock-oauth/config.json). `/default`
    # is a built-in issuer that responds before JSON_CONFIG_PATH is applied, so a
    # probe against it can go green while `plnd-dev` isn't serving yet — the
    # cold-start race behind the e2e 401/500 flakiness. Probing /plnd-dev/jwks
    # forces the config to load, the issuer to materialize, and its signing key
    # to generate — exactly the dependencies the token exchange relies on.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://localhost:8080/plnd-dev/jwks"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  alloy:
    image: grafana/alloy:latest
    ports:
      - "4317:4317"
      - "4318:4318"
      - "12345:12345"
    volumes:
      - ./config/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - alloy_data:/var/lib/alloy/data
    command: run /etc/alloy/config.alloy

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./config/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - ./config/observability/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

  tempo:
    image: grafana/tempo:2.10.3
    ports:
      - "3200:3200"
    volumes:
      - ./config/observability/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    command: -config.file=/etc/tempo.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - ./config/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION=true
    depends_on:
      tempo:
        condition: service_started
      prometheus:
        condition: service_started
      loki:
        condition: service_started

volumes:
  postgres_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
  alloy_data:
