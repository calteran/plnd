services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: plnd
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: plnd_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plnd -d plnd_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "3000:3000"
    environment:
      - APP_API__BASE_URL=0.0.0.0:3000
      - APP_DATABASE__URL=postgres://plnd:${DB_PASSWORD}@db/plnd_dev
      - APP_API__TIMEOUT=30000
      - APP_DATABASE__MAX_CONNECTIONS=10
      - APP_LOGGING__LEVEL=debug
      - APP_LOGGING__PRETTY_PRINT=true
      # Server-to-server: API → mock OAuth server inside Docker network
      - APP_AUTH__MOCK_INTERNAL_ISSUER_URL=http://mock-oauth-server:8080/plnd-dev
      # Browser redirect target after successful login
      - APP_AUTH__FRONTEND_CALLBACK_URL=http://localhost:4200/auth/callback
    depends_on:
      db:
        condition: service_healthy
      mock-oauth-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  mock-oauth-server:
    image: ghcr.io/navikt/mock-oauth2-server:3.0.1
    ports:
      - "8080:8080"
    environment:
      - ISSUER_ID=plnd-dev
      - INTERACTIVE_LOGIN=true
      - JSON_CONFIG=true
    volumes:
      - ./config/mock-oauth:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://localhost:8080/default/.well-known/openid-configuration"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - "4200:4200"
    environment:
      - NODE_ENV=development
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://127.0.0.1:4200"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  node_modules:
