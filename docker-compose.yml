services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: plnd
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: plnd_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plnd -d plnd_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  mock-oauth-server:
    image: ghcr.io/navikt/mock-oauth2-server:3.0.1
    ports:
      - "8080:8080"
    environment:
      - ISSUER_ID=plnd-dev
      - INTERACTIVE_LOGIN=true
      - JSON_CONFIG=true
    volumes:
      - ./config/mock-oauth:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://localhost:8080/default/.well-known/openid-configuration"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./scripts/ollama-entrypoint.sh:/entrypoint.sh:ro
    environment:
      - OLLAMA_FAST_MODEL=${OLLAMA_FAST_MODEL:-qwen2.5:3b}
      - OLLAMA_CAPABLE_MODEL=${OLLAMA_CAPABLE_MODEL:-qwen2.5:14b}
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    healthcheck:
      # `ollama list` queries the server API and is guaranteed to be in the image.
      # It succeeds as soon as ollama serve starts — before model pulls complete.
      # The api service depends_on this healthcheck, so the first inference
      # request may be slow while a model pull is still in progress.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  postgres_data:
  ollama_data:
