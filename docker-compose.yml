services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: plnd
      POSTGRES_PASSWORD: plnd_dev
      POSTGRES_DB: plnd_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  client:
    image: node:20
    working_dir: /app
    volumes:
      - ./plnd_client:/app
      - node_modules:/app/node_modules
    ports:
      - "4200:4200"
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npx ng serve --host 0.0.0.0 --poll 2000"

volumes:
  postgres_data:
  node_modules: